# Vhost Apache do MoneyApp.
# DocumentRoot = /var/www/html/public — só a pasta pública é servida diretamente.
# Os arquivos bootstrap.php, src/, sql/, data/ ficam fora da raiz web
# (não acessíveis via URL direta), conforme arquitetura do projeto.

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Reescrita desligada no MVP (URLs são /index.php, /api/init.php, etc).
        # Bloco mantido para extensões futuras.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ - [L]
    </Directory>

    # Bloqueia acesso direto a arquivos sensíveis (defesa em profundidade,
    # já que estão fora do DocumentRoot).
    <DirectoryMatch "^/var/www/html/(data|sql|src|vendor|tests)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/moneyapp_error.log
    CustomLog ${APACHE_LOG_DIR}/moneyapp_access.log combined
</VirtualHost>
