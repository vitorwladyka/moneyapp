; MoneyApp v2.0 — configurações PHP para o container Docker.
;
; OBJETIVO: garantir que respostas HTTP (especialmente /api/*.php que devolvem
; JSON) nunca sejam poluídas por warnings PHP, que fariam o parse JSON falhar
; no frontend e causariam erros como
; "Cannot read properties of undefined (reading 'split')" no dashboard.
;
; Carregado por último (prefixo zz-) para sobrescrever defaults do php.ini.

; NÃO exibir erros no body da resposta HTTP (produção/teste).
display_errors = Off
display_startup_errors = Off

; Registrar erros em log (visível via `docker compose logs moneyapp`).
log_errors = On
error_log = /proc/self/fd/2

; Nível de reporte: todos os erros exceto deprecations (compatível com PHP 8.2).
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Defaults de produção (defensivos).
expose_php = Off
session.use_strict_mode = 1

; Timezone pt-BR para funções de data do PHP que não usam UTC explícito.
; A app grava timestamps em UTC via Dates::nowUtcIso(), mas o timezone
; afeta exibição em logs e funções como date().
date.timezone = America/Sao_Paulo

; UTF-8 default (compatibilidade com caracteres pt-BR em strings).
default_charset = "UTF-8"
mbstring.internal_encoding = "UTF-8"
